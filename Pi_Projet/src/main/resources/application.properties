# Enable automatic schema creation/update
spring.jpa.hibernate.ddl-auto=update
spring.application.name=Pi_Projet
spring.datasource.url=jdbc:mysql://localhost:3306/PiProjet?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Port du serveur (optionnel)
server.port=8084

# Mail (required by EmailService)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Billing
billing.from-email=no-reply@piprojet.com
billing.from-name=Pi Projet
billing.admin-email=admin@piprojet.com
billing.app-url=http://localhost:4200